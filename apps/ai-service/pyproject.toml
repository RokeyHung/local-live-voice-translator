[project]
name = "llvt-ai-service"
version = "0.1.0"
description = "Local AI service (VAD/ASR/MT/TTS) for Local Live Voice Translator"
readme = "README.md"
authors = [
    { name = "RokeyHung", email = "hhungnm@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.139.2",
    "fugashi>=1.5.2",
    "jaconv>=0.5.0",
    "kokoro-onnx>=0.5.0",
    "misaki>=0.9.4",
    "mojimoji>=0.0.13",
    "numpy>=2.4.6",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyopenjtalk-plus>=0.4.1.post9",
    "pywhispercpp>=1.5.0",
    "sentencepiece>=0.2.2",
    "sherpa-onnx==1.10.46",
    "silero-vad>=6.2.1",
    "sqlalchemy>=2.0.51",
    "transformers>=5.14.1",
    "unidic-lite>=1.0.8",
    "uvicorn[standard]>=0.51.0",
    "websockets>=16.1.1",
]

[project.scripts]
llvt-ai-service = "llvt_ai_service:main"

[project.optional-dependencies]
mlx = [
    "mlx-audio>=0.4.0",
]
diarization = [
    "pyannote-audio>=3.3",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
eval = [
    "datasets>=4.0",
    "jiwer>=3.0",
    "sacrebleu>=2.4",
    "soundfile>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]  # I = isort (sort imports)

[tool.ruff.lint.isort]
known-first-party = ["llvt_ai_service"]
