[project]
name = "llvt-ai-service"
version = "0.1.0"
description = "Local AI service (VAD/ASR/MT/TTS) for Local Live Voice Translator"
readme = "README.md"
authors = [
    { name = "RokeyHung", email = "hhungnm@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.139.2",
    "fugashi>=1.5.2",
    "jaconv>=0.5.0",
    "kokoro-onnx>=0.5.0",
    "misaki>=0.9.4",
    "mojimoji>=0.0.13",
    "numpy>=2.4.6",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyopenjtalk-plus>=0.4.1.post9",
    "pywhispercpp>=1.5.0",
    "sentencepiece>=0.2.2",
    # Ghim cứng, KHÔNG nâng mà chưa thử `dlopen` trên macOS: wheel 1.10.46 bundle sẵn
    # libonnxruntime + C-API dylib, còn 1.13.x tham chiếu libonnxruntime.1.27.0.dylib
    # không kèm trong wheel nên adapter TTS chết ngay lúc import.
    "sherpa-onnx==1.10.46",
    "silero-vad>=6.2.1",
    "sqlalchemy>=2.0.51",
    "transformers>=5.14.1",
    "unidic-lite>=1.0.8",
    "uvicorn[standard]>=0.51.0",
    "websockets>=16.1.1",
]

[project.scripts]
llvt-ai-service = "llvt_ai_service:main"

[project.optional-dependencies]
mlx = [
    "mlx-audio>=0.4.0",
]
diarization = [
    "pyannote-audio>=3.3",
]
ctranslate2 = [
    "faster-whisper>=1.1",
    # CTranslate2 liên kết động với CUDA 12 và nạp DLL bằng TÊN lúc chạy câu đầu tiên,
    # nên thiếu hai gói này thì model tải xong, nạp xong, rồi mới chết bằng "Library
    # cublas64_12.dll is not found". Không dùng ké được cuBLAS của torch: bản cu130
    # mang `cublas64_13.dll`, tên khác. Chỉ đánh dấu cho Windows — máy Mac không có
    # CUDA, còn trên Linux thì bánh xe CTranslate2 đi đường khác.
    "nvidia-cublas-cu12>=12.9; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.26; sys_platform == 'win32'",
]
# Torch bản CUDA cho máy Windows/Linux có card NVIDIA. Không nằm trong phụ thuộc lõi
# vì bản trên PyPI chỉ có CPU và bản CUDA nặng thêm ~3 GB — quá đắt cho một bộ cài mà
# phần lớn máy đích không có card rời. Cài riêng khi cần đo hoặc chạy nhanh:
#   uv sync --extra cuda      (và `make dist BUNDLE_EXTRAS="--extra cuda"` nếu muốn gói)
# Khâu được lợi là MT: NLLB chạy CPU mất ~1,7 s/câu, là khâu chậm nhất chuỗi trên
# Windows. ASR không cần extra này — whisper.cpp đi đường Vulkan, faster-whisper mang
# runtime CUDA riêng trong wheel CTranslate2.
cpu = [
    "torch==2.13.0",
]
cuda = [
    "torch==2.13.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
eval = [
    "datasets>=4.0",
    "jiwer>=3.0",
    "sacrebleu>=2.4",
    "soundfile>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]  # I = isort (sort imports)

[tool.ruff.lint.isort]
known-first-party = ["llvt_ai_service"]

# Chỉ số riêng của PyTorch cho bản CUDA 13.0 — PyPI không phát hành bản +cu*.
# `explicit = true`: chỉ những gói được trỏ vào đây mới lấy từ chỉ số này, còn lại
# vẫn đi PyPI. Cặp `extra = "cuda"` giữ cho bản mặc định (CPU) không đổi.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# Hai extra phải được khai là XUNG ĐỘT, không chỉ là hai lựa chọn. Thiếu dòng này thì
# uv gộp cả hai vào một lần giải phụ thuộc, chọn ra một bản torch duy nhất — và bản
# CUDA thắng, nên `uv sync` trần (thứ mà tools/bundle_service.sh chạy) cũng kéo về
# ~3 GB thư viện NVIDIA. Đo bằng `uv sync --dry-run`: mặc định phải là torch thường.
[tool.uv]
# Ghim đúng bản torch mà hai bộ cài macOS/Windows đã kiểm — thêm chỉ số CUDA vào đây
# không phải lý do để nâng thư viện lõi. Ràng buộc này áp cho cả nhánh mặc định lẫn
# nhánh CUDA (`==2.13.0` khớp cả `2.13.0+cu130`).
constraint-dependencies = ["torch==2.13.0"]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cuda" },
]
